position:absolute;left:15px;top:12px;color:var(--muted);font-size:20px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.filters button{background:#f5f7f5;border:1px solid var(--line);border-radius:999px;min-height:42px;padding:8px 15px;color:var(--muted);font-size:14px}.filters button.active{background:var(--green);border-color:var(--green);color:#fff}.resultline{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 2px 12px;color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.day{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;transition:transform .15s,border-color .15s}.day:hover{transform:translateY(-1px);border-color:#b6c9b4}.number{width:49px;height:49px;flex:0 0 49px;border-radius:14px;background:#eaf1e6;color:var(--green);display:grid;place-items:center;font-size:20px;font-weight:750}.day.featured .number{background:var(--green);color:var(--lime)}.detail{min-width:0;flex:1}.title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:11px;color:#506d52;background:#edf4e8;border-radius:999px;padding:5px 8px;white-space:nowrap}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px;text-align:center;color:var(--muted);grid-column:1/-1}.note{margin:22px 2px 0;color:var(--muted);font-size:13px}.note a{color:var(--green);text-decoration:underline;text-underline-offset:3px}.footer{margin-top:38px;border-top:1px solid var(--line);padding-top:17px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:620px){.wrap{padding:18px 16px 38px}.top{margin-bottom:22px}.hero{padding:27px 23px;border-radius:23px}.hero:after{width:180px;height:180px;right:-105px}.hero h1{font-size:30px}.hero p{font-size:14px}.stats{margin-top:20px}.stat{min-width:0;flex:1;padding:10px 12px}.controls{padding:15px;border-radius:18px}.cards{grid-template-columns:1fr;gap:9px}.day{padding:13px}.number{width:45px;height:45px;flex-basis:45px}.tag{font-size:10px}.resultline{margin-top:18px}.footer{margin-top:30px}}

<body>
<main class="wrap">
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true">英</span>英语随身学</div><a class="toplink" href="https://marsh-princess-35f.notion.site/ae224156f5f743f1b3bd85db3b2d0bc1?v=715ce3ab8f8b4c5a96ef5e172af7d9c5" target="_blank" rel="noopener">打开原课程总表 ↗</a></header>
  <section class="hero"><div class="eyebrow">DAILY ENGLISH · COURSE LIBRARY</div><h1>今天想学哪一天？</h1><p>按 Day、主题或博主快速找到课程，手机上也能轻松挑选。</p><div class="stats"><div class="stat"><strong>119</strong><span>门课程</span></div><div class="stat"><strong>Day 1–119</strong><span>连续收录</span></div></div></section>
  <section class="controls" aria-label="查找课程"><label class="search"><span class="glass" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜 Day、主题或博主，例如：Day 28、旅行" autocomplete="off" aria-label="搜索课程"></label><div id="filters" class="filters" aria-label="按期数筛选"></div></section>
  <div class="resultline"><span id="result-count" aria-live="polite">共 119 门课程</span><span>由早到晚排列</span></div>
  <section id="cards" class="cards" aria-label="课程列表"></section>
  <p class="note">Day 2 已整理成手机学习版。其他课程会打开对应的原始课程页。<br><a href="day2.html">直接进入 Day 2 手机学习版 →</a></p>
  <footer class="footer"><span>英语随身学 · 随时学一点</span><span>学习记录保存在当前设备</span></footer>
</main>
<script src="days.js"></script>
<script>
(() => {
  const days = window.DAY_INDEX || [];
  const cards = document.getElementById('cards');
  const search = document.getElementById('search');
  const filters = document.getElementById('filters');
  const resultCount = document.getElementById('result-count');
  let period = 'all';
  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const periods = [...new Set(days.map(item => item.period).filter(Boolean))];
  filters.innerHTML = [['all','全部期数'], ...periods.map(value => [value,value])].map(([value,label]) => '<button type="button" data-period="' + esc(value) + '" class="' + (period===value?'active':'') + '" aria-pressed="' + (period===value) + '">' + esc(label) + '</button>').join('');
  function render() {
    const query = search.value.trim().toLocaleLowerCase();
    const visible = days.filter(item => {
      if (period !== 'all' && item.period !== period) return false;
      const haystack = [item.day, item.title, item.author, item.accent, item.topic, item.status].join(' ').toLocaleLowerCase();
      return !query || haystack.includes(query);
    });
    resultCount.textContent = query || period !== 'all' ? '找到 ' + visible.length + ' 门课程' : '共 ' + visible.length + ' 门课程';
    cards.innerHTML = visible.length ? visible.map(item => {
      const isDay2 = item.day === 2;
      const href = isDay2 ? 'day2.html' : item.sourceUrl;
      const destination = isDay2 ? '手机学习版' : '原课程';
      const meta = [item.topic, item.author, item.accent].filter(Boolean).join(' · ');
      return '<a class="day ' + (isDay2?'featured':'') + '" href="' + esc(href) + '" ' + (isDay2?'':'target="_blank" rel="noopener"') + ' aria-label="Day ' + item.day + '，' + esc(item.topic) + '，' + esc(destination) + '"><span class="number">' + String(item.day).padStart(2,'0') + '</span><span class="detail"><span class="title">' + esc(item.title || ('英语积累 Day ' + item.day)) + '</span><span class="meta">' + esc(meta || item.period) + '</span></span><span class="tag">' + esc(destination) + '</span></a>';
    }).join('') : '<div class="empty">没有找到符合条件的课程，试试其他 Day、主题或博主。</div>';
  }
  search.addEventListener('input', render);
  filters.addEventListener('click', event => {
    const button = event.target.closest('[data-period]');
    if (!button) return;
    period = button.dataset.period;
    filters.querySelectorAll('button').forEach(item => {
      const active = item.dataset.period === period;
      item.classList.toggle('active', active);
      item.setAttribute('aria-pressed', String(active));
    });
    render();
  });
  render();
})();
</script>
</body>
</html>
